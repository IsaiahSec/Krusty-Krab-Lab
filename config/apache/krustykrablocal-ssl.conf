<VirtualHost *:443>
    ServerName intranet.krustykrab.local
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/ssl/localcerts/intranet.crt
    SSLCertificateKeyFile /etc/ssl/localcerts/intranet.key

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/intranet-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/intranet-ssl-access.log combined
</VirtualHost>

